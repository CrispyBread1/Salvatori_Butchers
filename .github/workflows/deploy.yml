name: Build and Release

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g., v1.0.0)"
        required: true

jobs:
  cleanup-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Delete old artifacts
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const repo = context.repo;
            console.log(`Cleaning up artifacts for ${repo.owner}/${repo.repo}`);

            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: repo.owner,
              repo: repo.repo
            });

            const artifactsToDelete = artifacts.data.artifacts.slice(5);

            for (const artifact of artifactsToDelete) {
              console.log(
                `Deleting artifact ${artifact.name} (ID: ${artifact.id})`
              );

              await github.rest.actions.deleteArtifact({
                owner: repo.owner,
                repo: repo.repo,
                artifact_id: artifact.id
              });
            }


  build-macos:
    needs: cleanup-artifacts
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyqt5
          pip install requests
          pip install PyQtWebEngine
          pip install pyinstaller
          pip install python-dotenv
          pip install openpyxl
          pip install pandas
          pip install -r requirements.txt || echo "No requirements.txt found"

      - name: Build macOS app bundle
        run: |
          pyinstaller macos.spec

      - name: Verify app bundle creation
        run: |
          ls -la dist/

          if [ -d "dist/ManageMeStock.app" ]; then
            echo "App bundle created successfully!"
          else
            echo "App bundle creation failed! Checking directory contents:"
            ls -R dist/
            exit 1
          fi

      - name: Create DMG for macOS
        run: |
          brew install create-dmg

          create-dmg \
            --volname "ManageMeStock" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "ManageMeStock.app" 175 190 \
            --hide-extension "ManageMeStock.app" \
            --app-drop-link 425 190 \
            "ManageMeStock.dmg" \
            "dist/ManageMeStock.app" \
            || echo "DMG creation failed, continuing with app bundle"

      - name: Package app for release
        run: |
          cd dist

          if [ -f "../ManageMeStock.dmg" ]; then
            mv "../ManageMeStock.dmg" .
            echo "DMG package ready for release"
          else
            zip -r \
              "ManageMeStock-Mac-${{ github.event.inputs.version }}.zip" \
              ManageMeStock.app

            echo "ZIP package ready for release"
          fi

          ls -la

      - name: Create macOS Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/ManageMeStock.dmg
            dist/ManageMeStock-Mac-${{ github.event.inputs.version }}.zip
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build-windows:
    needs: cleanup-artifacts
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyqt5
          pip install requests
          pip install PyQtWebEngine
          pip install pyinstaller
          pip install python-dotenv
          pip install openpyxl
          pip install pandas
          pip install matplotlib

      - name: Debug dependencies
        run: |
          python -c "import requests; print('Dependencies imported successfully!')"

      - name: Build executable
        run: |
          pyinstaller main.spec

      - name: Create Windows Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/ManageMeStock.exe
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
