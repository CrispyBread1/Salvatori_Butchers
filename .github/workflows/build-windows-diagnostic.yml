name: Build Windows Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-diagnostic:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyqt5
          pip install requests
          pip install PyQtWebEngine
          pip install pyinstaller
          pip install python-dotenv
          pip install openpyxl
          pip install pandas
          pip install matplotlib

      - name: Build diagnostic executable
        run: |
          python -m PyInstaller --clean --noconfirm diagnostic.spec

      - name: Upload diagnostic executable
        uses: actions/upload-artifact@v4
        with:
          name: ManageMeStock-Diagnostic
          path: dist/ManageMeStock-Diagnostic.exe
          if-no-files-found: error
          retention-days: 3
